services:
  backend:
    image: abidtanoli/cricall-backend:v1
    build:
      context: ./Backend
      target: production
    container_name: cricall-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ${BACKEND_ENV_FILE:-./Backend/.env}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - cricall-net

  user-frontend:
    image: abidtanoli/cricall-user-frontend:v1
    build:
      context: ./Frontend
      dockerfile: User/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Empty when unset, which the frontend's featureFlags() treats as its
        # default (external sections hidden, platform sections visible).
        VITE_SHOW_INTERNATIONAL: ${VITE_SHOW_INTERNATIONAL:-}
        VITE_SHOW_HIGHLIGHTS: ${VITE_SHOW_HIGHLIGHTS:-}
        VITE_SHOW_CRICKET_NEWS: ${VITE_SHOW_CRICKET_NEWS:-}
        VITE_SHOW_VIDEOS: ${VITE_SHOW_VIDEOS:-}
        VITE_SHOW_RANKINGS: ${VITE_SHOW_RANKINGS:-}
        VITE_SHOW_COMPARISON: ${VITE_SHOW_COMPARISON:-}
        VITE_SHOW_BLOGS: ${VITE_SHOW_BLOGS:-}
    container_name: cricall-user-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    depends_on:
      - backend
    networks:
      - cricall-net

  admin-frontend:
    image: abidtanoli/cricall-admin-frontend:v1
    build:
      context: ./Frontend
      dockerfile: Admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: cricall-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    depends_on:
      - backend
    networks:
      - cricall-net

  mongodb:
    image: mongo:7
    container_name: cricall-mongo
    profiles:
      - local-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cricall-net

volumes:
  mongo_data:
  uploads_data:

networks:
  cricall-net:
    driver: bridge
