<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="robots" content="__ROBOTS__" />
    <title>__APP_NAME__ — You are offline</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 20px
          calc(24px + env(safe-area-inset-bottom, 0px));
        background: __THEME_COLOR__;
        color: #e2e8f0;
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: __CARD_BG__;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 28px 22px;
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #ffffff;
      }
      .mark img { width: 40px; height: 40px; object-fit: contain; }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      p { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: #94a3b8; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #ff6b35;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><img src="/brand/emblem.png" alt="" /></div>
      <h1>You are offline</h1>
      <p>__OFFLINE_MESSAGE__</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
