name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Start server
        run: |
          MONGO_URL="mongodb://127.0.0.1:27017/cric-all-e2e" \
          JWT_SECRET="ci-only-secret" \
          LOG_LEVEL=info \
          MAIL_DRIVER=console \
          PORT=5000 \
          node src/index.js > backend.log 2>&1 &
          echo "PID=$!" >> $GITHUB_ENV
          curl --fail --retry-connrefused --retry 10 --retry-delay 2 http://localhost:5000/api/health
        working-directory: Backend

      - name: Run scoring tests
        run: npm test
        working-directory: Backend
        env:
          BASE_URL: http://localhost:5000/api
          E2E_API_BASE: http://127.0.0.1:5000/api
          E2E_BACKEND_LOG: backend.log

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: Backend
        env:
          BASE_URL: http://localhost:5000/api

      - name: Stop server
        if: always()
        run: kill ${{ env.PID }} || true

  frontend-admin:
    name: Frontend (Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/Admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/Admin

      - name: Run component tests
        run: npm test
        working-directory: Frontend/Admin

      - name: TypeScript / Vite build check
        run: npx vite build --mode production --logLevel error
        working-directory: Frontend/Admin
        env:
          VITE_SOCKET_URL: http://localhost:5000
          VITE_API_URL: http://localhost:5000/api

  frontend-user:
    name: Frontend (User)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/User/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/User

      - name: Run component tests
        run: npm test
        working-directory: Frontend/User

      - name: Vite build check
        run: npx vite build --mode production --logLevel error
        working-directory: Frontend/User
        env:
          VITE_SOCKET_URL: http://localhost:5000
          VITE_API_URL: http://localhost:5000/api
